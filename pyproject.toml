[tool.flake8]
max-line-length = 88
extend-ignore = [
  "E203", # black-compatible slicing whitespace
  "W503", # line break before binary operator (black)
]
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  ".mypy_cache",
  ".pytest_cache",
]

[tool.mypy]
python_version = "3.9"
pretty = true
show_error_codes = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Treat `src/` as package base so mypy doesn't see duplicates
explicit_package_bases = true
mypy_path = ["."]

